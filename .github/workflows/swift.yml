---
name: Swift

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: read

jobs:

  build-macos:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # The package's Package.swift declares swift-tools-version: 6.3.
      # On macOS that toolchain ships with Xcode 26.4.1 (Xcode 26.2 and
      # earlier are Swift 6.2.x). The macos-26 runner's default Xcode
      # drifts over time, so pin it explicitly for a reproducible build.
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      - name: Test (macOS)
        run: swift test -v --skip-build --no-parallel

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official Swift 6.3 image (Ubuntu 24.04 "noble"). Pure-Swift
    # package with no system-library dependencies, so no extra apt
    # packages are needed.
    container:
      image: swift:6.3-noble
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      - name: Build (Linux)
        run: swift build --build-tests -v
      - name: Test (Linux)
        run: swift test -v --skip-build --no-parallel
